services:
  # Applicazione Chat Organizer
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat_organizer_app
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/chat_organizer?authSource=admin
      # Aggiungi altre variabili d'ambiente qui o usa env_file
    env_file:
      - .env
    volumes:
      # Monta directory per persistenza sessioni WhatsApp
      - ./wwebjs_auth:/app/.wwebjs_auth
      - ./wwebjs_cache:/app/.wwebjs_cache
    depends_on:
      - mongodb
    networks:
      - chat_organizer_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:7.0
    container_name: chat_organizer_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: chat_organizer
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - chat_organizer_network

  # Opzionale: MongoDB Express per interfaccia web
  mongo-express:
    image: mongo-express:1.0.0
    container_name: chat_organizer_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - chat_organizer_network

volumes:
  mongodb_data:

networks:
  chat_organizer_network:
    driver: bridge




